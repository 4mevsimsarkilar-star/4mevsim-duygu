<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>4mevsimŞabloncu • NRA • His Evreni — Tek Proje</title><style>
:root{--bg:#070a0f;--card:#111722;--line:#263044;--text:#e9ecf1;--muted:#9aa3b2;--teal:#14b8a6;--gold:#f0c94b}*{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(circle at top,#111827 0,#020308 55%,#000 100%);color:var(--text);font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Arial;overflow:hidden}.shell{height:100vh;display:flex;flex-direction:column}.top{padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(7,10,15,.88);backdrop-filter:blur(18px);display:flex;align-items:center;gap:12px;flex-wrap:wrap;z-index:20}.brand{display:flex;align-items:center;gap:10px;min-width:280px}.brand img{width:42px;height:42px;border-radius:50%;object-fit:cover}.brand b{font-size:18px;color:var(--teal)}.brand span{display:block;font-size:11px;color:var(--muted)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}.tab{border:1px solid var(--line);background:#111722;color:var(--muted);padding:9px 13px;border-radius:10px;cursor:pointer;font-weight:700}.tab.active{border-color:var(--teal);color:var(--teal);background:rgba(20,184,166,.12)}.workspace{position:relative;flex:1;min-height:0}.frame{position:absolute;inset:0;border:0;width:100%;height:100%;background:#05070b;display:none}.frame.active{display:block}.notice{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:5;display:none;padding:7px 12px;border-radius:999px;background:rgba(20,184,166,.12);border:1px solid rgba(20,184,166,.4);color:#99f6e4;font-size:11px;pointer-events:none}.notice.show{display:block}</style></head><body><div class="shell"><div class="top"><div class="brand"><img src="4mş-logo.png"><div><b>4mevsimŞabloncu • NRA • His Evreni</b><span>Tek proje • Ana Program merkezli</span></div></div><div class="tabs"><button class="tab active" data-module="main">🏠 Ana Program</button><button class="tab" data-module="prompt">💽 Video Kapak Prompt Aracı</button><button class="tab" data-module="assistant">🧑‍💻 Dijital İçerik Asistanı</button></div></div><div class="workspace"><iframe id="frame-main" class="frame active" src="4mevsimAna.html" title="Ana Program"></iframe><iframe id="frame-prompt" class="frame" src="Video-Kapak-Prompt-Araci.html" title="Video Kapak Prompt Aracı"></iframe><iframe id="frame-assistant" class="frame" src="Dijital-Icerik-Asistani.html" title="Dijital İçerik Asistanı"></iframe><div id="notice" class="notice">Ana Program verileri güncellendi</div></div></div><script>
const state={type:'Şarkı Videoları',artist:'',song:'',feel:''};
function sendTo(name){const f=document.getElementById('frame-'+name);if(f?.contentWindow)f.contentWindow.postMessage({target:'4mevsim-'+name,type:'PROJECT_STATE',data:{...state}},'*')}
function sendChildren(){sendTo('prompt');sendTo('assistant')}
function openUnifiedModule(name){if(!['main','prompt','assistant'].includes(name))return;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.module===name));document.querySelectorAll('.frame').forEach(f=>f.classList.toggle('active',f.id==='frame-'+name));if(name!=='main')sendTo(name)}
window.openUnifiedModule=openUnifiedModule;
window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='NAVIGATE_MODULE'&&d.module){openUnifiedModule(d.module);return}if(d.type==='REQUEST_MAIN_STATE'){if(e.source)e.source.postMessage({target:'4mevsim-'+(d.module||''),type:'PROJECT_STATE',data:{...state}},'*');return}if(d.type==='PROJECT_UPDATE'&&d.source==='4mevsim-main'&&d.data){state.type=d.data.type??state.type;state.artist=d.data.artist??'';state.song=d.data.song??'';state.feel=d.data.feel??'';sendChildren();const n=document.getElementById('notice');n.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>n.classList.remove('show'),800)}});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>openUnifiedModule(b.dataset.module)));['prompt','assistant'].forEach(n=>document.getElementById('frame-'+n).addEventListener('load',()=>sendTo(n)));
</script></body></html>
