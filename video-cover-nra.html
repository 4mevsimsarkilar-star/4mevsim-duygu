<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NRAtölye PRO • NRA Prompt Aracı (V3.7)</title>

<style>
/* ========== NEO HİS EVRENİ GÖRSEL TEMASI ========== */
:root {
    --bg: #0f1115;
    --card: #151922;
    --muted: #9aa3b2;
    --text: #e9ecf1;
    --accent: #14b8a6; 
    --line: #222838;
    --btn: #1f2633;
    --btnh: #273042;
    --amber: #f0c94b;
    --gold: #f5c26b;
    --danger: #ef4444;
    --btn-shadow: 0 18px 40px rgba(0,0,0,0.75);
}

* { box-sizing: border-box; transition: all 0.2s ease; }

body {
    margin: 0;
    background: radial-gradient(circle at top, #111827 0, #020308 52%, #000 100%);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, Arial, sans-serif;
    padding: 20px;
    display: flex;
    justify-content: center;
}

.container { max-width: 1000px; width: 100%; }

header {
    display: flex; align-items: center; justify-content: center; gap: 20px;
    margin-bottom: 25px; padding: 20px; border-radius: 24px;
    background: linear-gradient(135deg, rgba(15,23,42,0.88), rgba(15,23,42,0.65));
    border: 1px solid rgba(148,163,184,0.3); box-shadow: var(--btn-shadow); backdrop-filter: blur(18px);
}

.logo-real {
    width: 80px; height: 80px; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; overflow: hidden;
    background: radial-gradient(circle at 30% 30%, #a5f3fc 0, #22c55e 40%, #0f172a 100%);
    box-shadow: 0 0 0 1px rgba(15,23,42,.9), 0 0 18px rgba(45,212,191,.7), 0 0 40px rgba(56,189,248,.55);
    animation: nraGlow 4s ease-in-out infinite;
}

.logo-real img { width: 100%; height: 100%; object-fit: cover; }

@keyframes nraGlow {
  0%, 100% { box-shadow: 0 0 0 1px rgba(15,23,42,.9), 0 0 18px rgba(45,212,191,.7), 0 0 40px rgba(56,189,248,.55); }
  50% { box-shadow: 0 0 0 1px rgba(15,23,42,.9), 0 0 25px rgba(20, 184, 166, 0.9), 0 0 60px rgba(56,189,248,.8); transform: scale(1.02); }
}

header h2 {
    margin: 0; font-size: 26px;
    background: linear-gradient(to right, var(--accent), var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}

.main-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 25px; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

input, select {
    width: 100%; background: #0f131a !important; border: 1px solid var(--line) !important;
    border-radius: 12px !important; color: var(--text) !important; padding: 14px !important;
    font-size: 15px; margin: 8px 0; outline: none;
}

.input-container { position: relative; }
.clear-input {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: var(--btn); border: 1px solid var(--line); color: var(--muted);
    border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 11px;
}
.clear-input:hover { background: var(--danger); color: white; }

.icon-info {
    font-size: 12px; color: var(--amber); margin-bottom: 10px; padding-left: 5px; min-height: 18px;
}

.links {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 15px 0; padding: 12px;
    background: rgba(255,255,255,0.03); border-radius: 14px;
}

.links button {
    background: var(--btn); color: var(--muted); border: 1px solid var(--line);
    padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer;
}

.preview-area { text-align: center; border-top: 1px solid var(--line); padding-top: 20px; }

#previewImg {
    max-width: 100%; height: auto; max-height: 250px; border-radius: 15px;
    border: 2px dashed var(--line); margin: 15px 0; display: block; margin-left: auto; margin-right: auto;
}

.action-btns { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
.btn-main { background: var(--accent); color: #000; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
.btn-sub { background: var(--btn); color: var(--text); border: 1px solid var(--line); padding: 12px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
.btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); padding: 12px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }

.prompt-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px;
}

.prompt-box { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
.prompt-box h3 { margin: 0; font-size: 15px; color: var(--accent); display: inline-block; }
.prompt-tr { font-size: 12px; color: var(--muted); display: block; margin-bottom: 10px; font-style: italic; }

textarea {
    width: 100%; height: 180px; background: #090c10; color: #cbd5e1; border: 1px solid #1e293b;
    border-radius: 10px; padding: 12px; font-family: monospace; font-size: 13px; resize: none;
}

.box-btns { display: flex; gap: 8px; margin-top: 10px; }
.copy-btn { flex: 2; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; padding: 10px; }
.edit-btn { flex: 1; background: var(--btn); color: var(--text); border: 1px solid var(--line); border-radius: 8px; font-weight: bold; cursor: pointer; }

</style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-real">
            <img src="NRAtölyelogo.png" alt="NR" onerror="this.src='https://via.placeholder.com/80/14b8a6/fff?text=NR'">
        </div>
        <h2>NRAtölye PRO • NRA Prompt Aracı (V3.7)</h2>
    </header>

    <div class="main-card">
        <div class="input-container">
            <input type="text" id="artist" placeholder="Sanatçı / Yazar Adı">
            <button class="clear-input" onclick="clearField('artist')">✕</button>
        </div>
        <div class="input-container">
            <input type="text" id="song" placeholder="Eser / Video Başlığı">
            <button class="clear-input" onclick="clearField('song')">✕</button>
        </div>
        <div class="input-container">
            <input type="text" id="icon" placeholder="Simge (Yazınca otomatik önerilebilir)">
            <button class="clear-input" onclick="clearField('icon')">✕</button>
        </div>
        <div id="iconTranslation" class="icon-info"></div>

        <select id="format">
            <option value="horizontal">📺 Yatay (YouTube 1920x1080)</option>
            <option value="vertical">📱 Dikey (Shorts 1080x1920)</option>
        </select>

        <div style="text-align: right; margin-top: 10px;">
            <button class="btn-danger" style="padding: 8px 16px; font-size: 13px;" onclick="clearAllFields()">🧹 Tüm Yazıları Temizle</button>
        </div>

        <div class="links">
            <button onclick="openSite('https://copilot.microsoft.com/')">Copilot</button>
            <button onclick="openSite('https://gemini.google.com/app')">Gemini</button>
            <button onclick="openSite('https://chatgpt.com/')">Chatgpt</button>
            <button onclick="openSite('https://grok.com/')">Grok</button>
            <button onclick="openSite('https://manus.im/app')">Manus</button> 
            <button onclick="openSite('https://firefly.adobe.com/')">Firefly</button>
        </div>

        <div class="preview-area">
            <input type="file" id="fileInput" accept="image/*" onchange="previewImage(event)" style="display:none">
            <button class="btn-sub" onclick="document.getElementById('fileInput').click()">📂 Dosya Seç</button>
            <img id="previewImg" src="">
            <div class="action-btns">
                <button class="btn-main" onclick="pasteImage()">📋 Yapıştır</button>
                <button class="btn-main" style="background: var(--gold);" onclick="downloadImage()">💾 İndir</button>
                <button class="btn-danger" onclick="clearImage()">🗑️ Resmi Kaldır</button>
            </div>
        </div>
    </div>

    <div class="prompt-grid" id="prompts"></div>
</div>

<script>
const promptsData = ["p1","p2","p3","p4","p5","p6","p7","p8","p9","p10","p11","p12"];
const titles = [
    "🏹 Sinematik Anadolu", "🌟 Altın Sıcaklığı", "🎭 Dramatik Ruh Hali", 
    "🌹 Cıvıl Cıvıl / Kırmızı Gül", "🕌 Dini / İlahi", "🌤️ Ortam / Rahatlama",
    "🥀 Kırmızı Siyah Odaklı", "🇹🇷͜͜͡͡✯ Vatan Sevdalısı", "📚 Edebi Eser / Düz Yazı",
    "🔍 Kelime Gizemi / Eğitici", "💚 Gönül Kapısı / Manevi Sohbet", "🎞️ Nostalji / Eski Dönem"
];
const trDescriptions = [
    "Kültürel dokularla harmanlanmış, sinematik Türk müziği tarzı.",
    "Yumuşak, parlak ve altın sarısı ışıklarla süslenmiş sıcak tema.",
    "Ağır gölgeli, duygusal ve melankolik film afişi havası.",
    "Canlı kırmızı güller ve romantik gün ışığıyla dolu enerjik tema.",
    "Huzurlu, manevi ışıklı ve cami silüetli ruhani atmosfer.",
    "Yağmurlu, puslu veya şömine sıcaklığında dinlendirici tema.",
    "Siyah kadife fon üzerinde parlak kırmızı neon/ışık vurguları.",
    "Şanlı bayrak ve kahramanlık temalı görkemli görsel yapısı.",
    "Eski radyo, kitaplık ve loş lamba ışığında hikaye anlatıcısı.",
    "Uçuşan harfler ve gizemli bir kütüphane temalı eğitici kapak.",
    "Bilgece ve manevi anlatımlar için sıcak, odaklanmış atmosfer.",
    "Eski plaklar, gramofon ve nostaljik İstanbul estetiği."
];

const container = document.getElementById("prompts");

promptsData.forEach((id,i)=>{
    let div=document.createElement("div");
    div.className="prompt-box";
    div.innerHTML=`
    <div class="prompt-header">
        <h3>${titles[i]}</h3>
        <span class="prompt-tr">${trDescriptions[i]}</span>
    </div>
    <textarea id="${id}" class="locked" readonly></textarea>
    <div class="box-btns">
        <button class="edit-btn" onclick="toggleEdit('${id}',this)">🔒 Kilitli</button>
        <button class="copy-btn" onclick="copyText('${id}',this)">📋 Kopyala</button>
    </div>
    `;
    container.appendChild(div);
});

const artistInput=document.getElementById("artist");
const songInput=document.getElementById("song");
const iconInput=document.getElementById("icon");
const formatInput=document.getElementById("format");
const iconTransDiv = document.getElementById("iconTranslation");

function updatePrompts(){
    let artist=artistInput.value||"İsim";
    let song=songInput.value||"Başlık";
    let icon=iconInput.value||"symbolic object";

    let sizeRule = formatInput.value === "vertical"
    ?`\n\n[Technical Specs: Aspect Ratio 9:16 vertical, resolution 1080x1920. Full-height portrait composition. --ar 9:16]`
    :`\n\n[Technical Specs: True 16:9 cinematic widescreen, resolution 1920x1080. Full-width landscape composition. Widescreen format required. --ar 16:9]`;

    const pTemplates = [
        `Transform the uploaded image into a cinematic Anadolu-style YouTube music cover.\n\nKeep the original person and face.\nEnhance colors, contrast and lighting.\n\nAdd subtle cultural textures.\n\nAdd a small decorative ${icon} in the scene.\n\nText:\n\n${artist}\n${song}\n\nPoster style, emotional, high contrast.` + sizeRule,
        `Use uploaded image as base.\n\nDo NOT change face.\n\nEnhance lighting and sharpness.\nAdd warm cinematic glow.\n\nAdd a ${icon} as a visual accent.\n\nText:\n\n${artist}\n${song}\n\nGolden typography, soft glow, YouTube thumbnail style.` + sizeRule,
        `Create a dramatic cinematic poster.\n\nKeep original subject.\n\nAdd strong shadows and emotional lighting.\n\nAdd symbolic object: ${icon}\n\nAtmosphere: melancholic, deep feeling.\n\nText:\n\n${artist}\n${song}\n\nProfessional poster composition, high contrast, cinematic mood.` + sizeRule,
        `Transform the uploaded image into a vibrant, colorful, romantic Turkish music cover.\n\nKeep the original face.\n\nEnhance colors with rich reds, gold tones and warm sunlight glow.\n\nAdd blooming roses, soft light flares and sparkles.\n\nAdd decorative ${icon} in a natural way.\n\nAtmosphere: joyful, romantic, lively, emotional.\n\nText:\n\n${artist}\n${song}\n\nHighly engaging YouTube thumbnail, vivid colors, eye-catching composition.` + sizeRule,
        `Transform the uploaded image into a spiritual Islamic themed cover.\n\nDo NOT change face.\n\nAdd soft نور (light), mosque silhouettes, crescent moon glow.\n\nColor palette: gold, deep green, warm light.\n\nAdd symbolic ${icon}.\n\nAtmosphere: peaceful, spiritual, emotional, sacred.\n\nText:\n\n${artist}\n${song}\n\nElegant Islamic design, soft glow, calming composition.` + sizeRule,
        `Create a relaxing ambient YouTube thumbnail.\n\nUse the uploaded image as base.\n\nEnhance with soft cinematic lighting.\n\nAdd atmosphere: rain, fireplace glow, fog, cozy light.\n\nAdd subtle ${icon} naturally.\n\nAtmosphere: calm, peaceful, relaxing, cozy.\n\nText:\n\n${artist}\n${song}\n\nSoft colors, ambient mood, minimal design, relaxing vibe.` + sizeRule,
        `Transform the uploaded image into a dramatic, high-contrast music cover with a bold bright red and black color palette.\n\nKeep the original face and pose exactly.\n\nBackground: Deep velvet black background contrasted with vibrant, luminous bright red stage lighting. Use sharp highlights and deep shadows.\n\nDecorations: Add lush bright red blooming roses and red/gold light flares.\n\nAdd symbolic ${icon} naturally.\n\nText:\n\n${artist}\n${song}\n\nElegant warm golden or bright white typography with soft glow. Cinematic 8k quality.` + sizeRule,
        `Transform the uploaded image into an epic, patriotic Turkish music cover.\n\nKeep the original face.\n\nBackground: A majestic waving Turkish flag, heroic lighting, and dramatic sky/clouds.\n\nAdd symbolic ${icon} naturally.\n\nText:\n\n${artist}\n${song}\n\nPowerful and majestic bold typography. Colors: Red and white. Heroic and emotional vibe.` + sizeRule,
        `Transform the uploaded image into a cozy, nostalgic storytelling (öykü) cover.\n\nKeep the original person as the author/narrator.\n\nBackground: A warm, dimly lit room with an old wooden bookshelf filled with classic books and a vintage nostalgic radio on a desk.\n\nLighting: Soft golden lamp glow, cinematic dust particles in the air, emotional atmosphere.\n\nAdd symbolic ${icon} naturally on the desk.\n\nText:\n\n${artist}\n${song}\n\nElegant, serif typography, classic book cover style. Cinematic 8k quality.` + sizeRule,
        `Transform the uploaded image into an intriguing, educational YouTube thumbnail for an analytical or mystery-themed video.\n\nKeep the original face but enhance details.\n\nBackground: A mysterious library, floating glowing letters, ancient parchments, or a detective's desk.\n\nLighting: High contrast, dramatic shadows, mysterious glowing accents (like amber or cyan light).\n\nAdd symbolic ${icon} naturally to emphasize discovery.\n\nText:\n\n${artist}\n${song}\n\nBold, cinematic typewriter typography. Analytical, mysterious, eye-catching vibe. Cinematic 8k quality.` + sizeRule,
        `Transform the uploaded image into a warm, wise, and spiritual "Gönül Sohbeti" cover.\n\nKeep the original person clearly visible.\n\nBackground: A cozy, warm-lit traditional room with soft textures and a peaceful atmosphere.\n\nLighting: Dramatic but soft "Rembrandt" lighting on the speaker's face.\n\nAdd symbolic ${icon} as a source of warm light.\n\nText:\n\n${artist}\n${song}\n\nElegant typography, meaningful and spiritual vibe, cinematic depth.` + sizeRule,
        `Create a classy "Vintage Istanbul Nostalgia" music cover using the uploaded photo.\n\nKeep the person's face original.\n\nBackground: A 1970s style luxury salon with a vintage gramophone, lace table covers, and a sunset Bosphorus view.\n\nColor Palette: Sepia tones mixed with deep burgundy.\n\nAdd a ${icon} on the table.\n\nText:\n\n${artist}\n${song}\n\nNostalgic Yeşilçam cinema typography, elegant, high class.` + sizeRule
    ];

    promptsData.forEach((id, i) => {
        let t = document.getElementById(id);
        if(t && t.hasAttribute("readonly")) t.value = pTemplates[i];
    });
}

function clearField(id) { 
    document.getElementById(id).value = ""; 
    if(id==='icon') iconTransDiv.innerText = "";
    updatePrompts(); 
}

function clearAllFields() { 
    artistInput.value = ""; songInput.value = ""; iconInput.value = ""; 
    iconTransDiv.innerText = "";
    updatePrompts(); 
}

function clearImage() { 
    document.getElementById("previewImg").src = ""; 
    currentImageURL = ""; 
    document.getElementById("fileInput").value = ""; 
}

function suggestIcon() {
    const text = songInput.value.toLowerCase() + " " + artistInput.value.toLowerCase();
    let s = ""; let tr = "";
    
    if(text.match(/ramazan|oruç|manevi|dini|gönül|sohbet|basri|hoca/)) { s = "warm glowing lantern"; tr = "Sıcak Kandil Işığı"; }
    else if(text.match(/nostalji|eski|yeşilçam|plak|mine|sanat müziği|gramofon/)) { s = "vintage gramophone"; tr = "Antika Gramofon"; }
    else if(text.match(/doğa|orman|yeşil/)) { s = "glowing magical leaf"; tr = "Parlayan Yaprak"; }
    else if(text.match(/yağmur|su|deniz/)) { s = "rain drops on glass"; tr = "Yağmur Damlaları"; }
    else if(text.match(/gece|yıldız|ay/)) { s = "crescent moon and stars"; tr = "Hilal ve Yıldızlar"; }
    else if(text.match(/aşk|kalp|sevgi/)) { s = "glowing red heart"; tr = "Kırmızı Kalp"; }
    else if(text.match(/gül|çiçek/)) { s = "red rose"; tr = "Kırmızı Gül"; }
    else if(text.match(/kitap|yazar|şiir/)) { s = "old dusty book"; tr = "Eski Tozlu Kitap"; }
    else if(text.match(/vatan|bayrak|türk/)) { s = "Turkish flag"; tr = "Türk Bayrağı"; }

    if(s && !iconInput.value) { 
        iconInput.value = s; 
        iconTransDiv.innerText = "Şu anki simge: " + tr;
        updatePrompts(); 
    }
}

iconInput.addEventListener("input", () => {
    if(!iconInput.value) iconTransDiv.innerText = "";
    else iconTransDiv.innerText = "Simge manuel giriliyor...";
    updatePrompts();
});

function toggleEdit(id,btn){
    let t=document.getElementById(id);
    if(t.hasAttribute("readonly")){
        t.removeAttribute("readonly"); t.classList.remove("locked");
        btn.innerText="🔓 Düzenle"; btn.style.background = "var(--amber)"; btn.style.color = "#000";
    }else{
        t.setAttribute("readonly",true); t.classList.add("locked");
        btn.innerText="🔒 Kilitli"; btn.style.background = "var(--btn)"; btn.style.color = "var(--text)";
    }
}

function copyText(id,btn){
    let t=document.getElementById(id); t.select();
    document.execCommand("copy"); btn.innerText="✔ Kopyalandı";
    setTimeout(()=>{ btn.innerText="📋 Kopyala"; },1500);
}

function openSite(url){ window.open(url, "_blank"); }
songInput.addEventListener("input", () => { suggestIcon(); updatePrompts(); });
artistInput.addEventListener("input", () => { suggestIcon(); updatePrompts(); });
formatInput.addEventListener("change",updatePrompts);

function previewImage(event){
    const file = event.target.files[0];
    if(file){
        const url = URL.createObjectURL(file);
        document.getElementById("previewImg").src = url;
        currentImageURL = url;
    }
}

let currentImageURL = "";
document.addEventListener("paste", function(e){
    const items = e.clipboardData.items;
    for(let i=0; i<items.length; i++){
        if(items[i].type.indexOf("image") !== -1){
            const file = items[i].getAsFile();
            const url = URL.createObjectURL(file);
            document.getElementById("previewImg").src = url;
            currentImageURL = url;
        }
    }
});

async function pasteImage(){
    try{
        const items = await navigator.clipboard.read();
        for (const item of items) {
            for (const type of item.types) {
                if (type.startsWith("image/")) {
                    const blob = await item.getType(type);
                    const url = URL.createObjectURL(blob);
                    document.getElementById("previewImg").src = url;
                    currentImageURL = url;
                }
            }
        }
    }catch(err){ alert("CTRL+V kullanın."); }
}

function downloadImage(){
    if(!currentImageURL) return alert("Resim yok!");
    const a = document.createElement("a");
    a.href = currentImageURL;
    a.download = "nratolye-kapak.png"; a.click();
}

updatePrompts();
</script>
</body>
</html>
