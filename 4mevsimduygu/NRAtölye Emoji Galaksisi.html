<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>NRAtölye • Emoji Galaksisi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#020617;
  --card:#0b1120;
  --accent:#14b8a6;
  --accent-soft:rgba(20,184,166,.25);
  --text:#e5e7eb;
  --muted:#9ca3af;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:radial-gradient(circle at top,#111827 0,#020617 45%,#000 100%);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  animation:fadeIn .8s ease both;
}

/* HEADER */
.header-row{
  position:sticky;
  top:0;
  z-index:1001;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  padding:18px 10px 10px;
  background:linear-gradient(to bottom, rgba(2,6,23,.96), rgba(2,6,23,.88));
  backdrop-filter:blur(14px);
  animation:headerSlide .9s ease;
}
.logo-inline{
  width:72px;height:72px;border-radius:50%;
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:#020617;border:1px solid #1f2937;
  animation:logoPulse 3s ease-in-out infinite;
}
.logo-inline img{width:100%;height:100%;object-fit:contain}
.title-box h1{font-size:22px;letter-spacing:.04em;margin:0}
.title-box h1 span{color:var(--accent);animation:titleGlow 3s ease infinite}
.title-box p{font-size:13px;color:#9ca3af}

/* APP */
.app{max-width:1200px;margin:0 auto;padding:8px 12px 16px}


/* ==========================================
   ÜST PANELİ 2 SATIRA AYIR
========================================== */
.controls {
    display: flex;
    flex-direction: column; /* Üst satır ve alt satır */
    gap: 10px;
    padding: 14px 18px;
}

/* ÜST SATIR — BUTONLAR */
.left-controls {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: flex-start;
}

/* ==========================================
   ALT SATIR — STOK ve RAPOR YAZISI
========================================== */
.status-row {
    width: 100%;
    display: flex;
    justify-content: space-between; /* Sol grup solda, buton sağda */
    align-items: center;
    margin-top: 4px;
}

/* Sol bölüm: stok + rapor */
.status-row-left {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
}

/* Sağ bölüm: En Başa Dön */
.status-row-right {
    margin-left: auto; /* En sağa sabitle */
    display: flex;
    align-items: center;
}



.field input{
  background:transparent;border:none;outline:none;
  color:var(--text);font-size:13px;
}
.field input::placeholder{color:#6b7280;font-size:13px}

/* SELECT */
.field select{
  border:none;
  outline:none;
  font-size:13px;
  background-color:#020617 !important;
  color:#e5e7eb !important;
  padding:4px 26px 4px 4px;
  appearance:none;
  -webkit-appearance:none;
  -moz-appearance:none;
  background-image:url('data:image/svg+xml;utf8,<svg width="12" height="12" viewBox="0 0 20 20" fill="%23e5e7eb" xmlns="http://www.w3.org/2000/svg"><path d="M5 7l5 5 5-5H5z"/></svg>');
  background-repeat:no-repeat;
  background-position:right 8px center;
  background-size:10px;
}
.field select option{
  background-color:#020617;
  color:#e5e7eb;
}

/* BUTONLAR */
button.btn{
  border-radius:999px;border:1px solid var(--accent-soft);
  background:#020617;color:var(--text);
  padding:6px 12px;font-size:12px;cursor:pointer
}
button.btn:hover{border-color:var(--accent)}
.status-bar{
  margin-top:8px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:4px;
  background:rgba(2,6,23,0.85);
  padding:8px 12px;
  border-radius:14px;
  box-shadow:0 0 12px rgba(0,0,0,.4);
  
  /* YENİ — kutu sabit genişlikte kalsın */
  width: 200px;
  min-width: 200px;
  max-width: 200px;
  overflow:hidden;
}
.status-bar span {
  white-space: normal !important;
  word-break: break-word;
}

/* GRID */
.grid-wrapper{margin-top:12px;max-height:calc(100vh - 190px);overflow-y:auto;overflow-x:hidden}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
  gap:12px;
}

/* KART */
.card{
  background:var(--card);border-radius:14px;padding:14px 6px;
  text-align:center;cursor:pointer;border:1px solid #1f2937;
  transform:rotate(-1.5deg);
  animation:galaxyFloat 3s ease-in-out infinite;
  transition:.25s;
}
.card:hover{
  transform:rotate(1.5deg) scale(1.08);
  box-shadow:0 0 30px rgba(20,184,166,.5)
}
.card-emoji{font-size:34px}
.card-label{font-size:11px;color:var(--muted)}

/* TOAST */
.toast{
  position:fixed;
  left:50%;bottom:24px;
  transform:translateX(-50%) scale(.9);
  background:rgba(15,23,42,0.6);
  background-image:radial-gradient(circle at top left, rgba(20,184,166,0.55), rgba(37,99,235,0.35));
  color:white;
  padding:20px 36px;
  border-radius:999px;
  font-size:16px;font-weight:600;
  opacity:0;transition:.25s;
  backdrop-filter:blur(20px) saturate(170%);
  text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}

/* MODAL */
#importModal{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.7);
  align-items:center;justify-content:center;z-index:9999
}
.modal-box{
  background:#020617;padding:16px;
  border-radius:14px;width:340px;
  border:1px solid var(--accent-soft)
}
.modal-box textarea{
  width:100%;height:80px;resize:vertical;
  background:#020617;border-radius:8px;
  border:1px solid #1f2937;color:white;padding:6px
}
.modal-actions{margin-top:8px;text-align:right;display:flex;gap:8px;justify-content:flex-end}

/* BACK TOP */
.back-top{
  padding:8px 16px;
  border-radius:999px;
  border:1px solid rgba(20,184,166,.45);
  background:#020617;
  cursor:pointer;
  font-size:11px;
  color:#14b8a6;
  white-space:nowrap;
  position:relative;
  margin-left:auto; /* sağa sabitleme */
}

.back-top:hover{
  box-shadow:0 0 12px rgba(20,184,166,.45);
  color:white;
}
.left-controls {
    display: flex;
    flex-wrap: nowrap; /* Kaymayı tamamen engeller */
    gap: 8px;
}
@media (max-width: 900px) {
  .left-controls {
      flex-wrap: wrap;
  }
}


/* ANİMASYONLAR */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes headerSlide{from{transform:translateY(-30px)}to{transform:none}}
@keyframes logoPulse{50%{transform:scale(1.07);box-shadow:0 0 24px rgba(20,184,166,.7)}}
@keyframes titleGlow{50%{text-shadow:0 0 22px rgba(20,184,166,1)}}
@keyframes galaxyFloat{
  0%{transform:rotate(-1.5deg) translateY(0)}
  50%{transform:rotate(1.5deg) translateY(-6px)}
  100%{transform:rotate(-1.5deg) translateY(0)}
}
</style>
</head>

  "⚽","🏀","🎾","🎨","🎵","🏳️","🚩","🏁","🇹🇷͜͜͡͡✯"];

// Türkçe isimler
const EMOJI_NAME_MAP = {
 "😀":"Gülen yüz","😁":"Sırıtma","😂":"Ağlayarak gülme","🤣":"Kahkahaya boğulan yüz",
 "😃":"Geniş gülümseme","😄":"Gülümseyen yüz","😅":"Terleyen gülümseme","😆":"Sıkıca gülen yüz",
 "😉":"Göz kırpan yüz","😊":"Mahcup gülümseme","😍":"Kalpli gözler","🥰":"Kalpli mutlu yüz",
 "😘":"Öpücük atan yüz","😎":"Güneş gözlüklü yüz","🤩":"Yıldız gözler","🥳":"Parti yüzü",
 "😡":"Kızgın yüz","😭":"Ağlayan yüz","😱":"Çığlık atan yüz","😴":"Uyuyan yüz",
 "🤔":"Düşünen yüz","🤗":"Sarılma yüzü",
 "👍":"Başparmak yukarı","👎":"Başparmak aşağı","👏":"Alkış","🙏":"Dua",
 "❤️":"Kırmızı kalp","🧡":"Turuncu kalp","💛":"Sarı kalp","💚":"Yeşil kalp",
 "💙":"Mavi kalp","💜":"Mor kalp","🤍":"Beyaz kalp","🖤":"Siyah kalp","💔":"Kırık kalp","🇹🇷͜͜͡͡✯":"TR Ay yıldız","🏳️":"Beyaz Bayrak","🏁":"Damalı Bayrak"};

let emojis = [];
let filtered = [];

const gridEl   = document.getElementById("emojiGrid");
const searchEl = document.getElementById("searchInput");
const filterEl = document.getElementById("categoryFilter");
const statsEl  = document.getElementById("stats");
const reportEl = document.getElementById("lastReport");
const toastEl  = document.getElementById("toast");
const modalEl  = document.getElementById("importModal");
const pasteEl  = document.getElementById("emojiPasteArea");

/* ===============================
   KATEGORİ & İSİM OTO
=============================== */
function autoCategory(e){
  const K = ["❤️","🧡","💛","💚","💙","💜","🤍","🖤","💔"];
  const D = ["😀","😁","😂","🤣","😊","😍","😘","😎","🤩","🥳","😭","😱","😴","🤔","🤗","😡"];
  const G = ["🌞","🌙","⭐","🔥","💧","🌊","🌳","🌍"];
  const N = ["📱","💻","🎮","🎧","📷","🎁","🧩","🛍️","⚽","🏀","🎾","🎨","🎵"];
  const B = ["🇹🇷͜͜͡͡✯","🏳️","🚩","🏁"];
  if (K.includes(e)) return "Kalpler";
  if (D.includes(e)) return "Duygular";
  if (G.includes(e)) return "Doğa";
  if (N.includes(e)) return "Nesneler";
  if (B.includes(e)) return "Bayraklar";
  return"nesne";
}
function autoName(e){
  return EMOJI_NAME_MAP[e] || "";
}
function buildEmojiObj(emoji, name, cat){
  const finalName = (name && name.trim()) || autoName(emoji);
  const finalCat  = (cat && cat.trim())  || autoCategory(emoji);
  return { emoji, name: finalName, cat: finalCat };
}

/* ===============================
   KATEGORİ LİSTESİ
=============================== */
function updateCategories(){
  const cats = new Set();
  emojis.forEach(e => {
    if (e.cat) cats.add(e.cat);
  });

  const currentValue = filterEl.value || "Tümü";
  filterEl.innerHTML = "";

  const optAll = document.createElement("option");
  optAll.value = "Tümü";
  optAll.textContent = "Tümü";
  filterEl.appendChild(optAll);

  Array.from(cats).sort((a,b)=>a.localeCompare(b,"tr")).forEach(cat => {
    const o = document.createElement("option");
    o.value = cat;
    o.textContent = cat;
    filterEl.appendChild(o);
  });

  if ([...cats,"Tümü"].includes(currentValue)) {
    filterEl.value = currentValue;
  } else {
    filterEl.value = "Tümü";
  }
}

/* ===============================
   YÜKLEME / KAYDETME
=============================== */
function loadEmojis(){
  let listObjs = [];
  const raw = localStorage.getItem(STORAGE_KEY);

  if (raw){
    try{
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length){
        // Eski tip sadece string stok
        if (typeof parsed[0] === "string"){
          listObjs = parsed
            .filter(e => typeof e === "string" && e.trim())
            .map(e => buildEmojiObj(e.trim()));
        }
        // Yeni tip obje stok
        else if (typeof parsed[0] === "object"){
          listObjs = parsed
            .filter(e => e && e.emoji)
            .map(e => buildEmojiObj(
              e.emoji,
              e.name || e.isim,
              e.cat || e.kategori
            ));
        }
      }
    }catch(err){
      console.warn("localStorage okunamadı, BASE'e dönülüyor:", err);
    }
  }

  // Eğer hiçbir şey yoksa BASE yükle
  if (!listObjs.length){
    listObjs = BASE.map(e => buildEmojiObj(e));
  }

  // Tekilleştir
  const map = new Map();
  listObjs.forEach(o => {
    if (!map.has(o.emoji)){
      map.set(o.emoji, o);
    }
  });

  emojis = Array.from(map.values());
  updateCategories();
  applyFilters();
}

function saveEmojis(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(emojis));
}

/* ===============================
   RENDER & FİLTRE
=============================== */
function renderGrid(){
  gridEl.innerHTML = "";
  filtered.forEach(i => {
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML =
      `<div class="card-emoji">${i.emoji}</div>
       <div class="card-label">${i.name || i.cat}</div>`;
    c.onclick = () => copyEmoji(i.emoji);
    gridEl.appendChild(c);
  });
  statsEl.textContent = `📦 Stok: ${emojis.length} emoji`;
}

function applyFilters(){
  const q   = (searchEl.value || "").toLowerCase().trim();
  const cat = filterEl.value || "Tümü";

  filtered = emojis.filter(i => {
    const name = (i.name || "").toLowerCase();
    const ccat = (i.cat  || "").toLowerCase();
    const matchText =
      !q ||
      i.emoji.includes(q) ||
      name.includes(q) ||
      ccat.includes(q);
    const matchCat = (cat === "Tümü") || (i.cat === cat);
    return matchText && matchCat;
  });

  renderGrid();
}

/* ===============================
   TOAST
=============================== */
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove("show"), 2200);
}

/* ===============================
   AKSİYONLAR
=============================== */
function copyEmoji(e){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(e);
  }
  showToast("Kopyalandı: " + e);
}

// Rastgele
document.getElementById("btnRandom").onclick = () => {
  if (!filtered.length) return;
  const item = filtered[Math.floor(Math.random() * filtered.length)];
  copyEmoji(item.emoji);
};

// Manuel import aç/kapat
document.getElementById("btnImport").onclick = () => {
  modalEl.style.display = "flex";
  pasteEl.value = "";
  pasteEl.focus();
};
function closeImportModal(){
  modalEl.style.display = "none";
}

// Hafızayı sıfırla → localStorage temizle + BASE yükle
function resetMemory(){
  if (!confirm("Tüm emoji hafızası silinsin ve temel stok (ilk 60 emoji) geri yüklensin mi?")) return;

  const onceki = emojis.length;
  localStorage.removeItem(STORAGE_KEY);

  emojis = BASE.map(e => buildEmojiObj(e));
  saveEmojis();
  updateCategories();
  applyFilters();

  showToast(`🧨 Hafıza sıfırlandı • ${onceki} emoji silindi • 🔁 ${emojis.length} temel emoji yüklendi`);
}

/* ===============================
   MANUEL EKLEME
=============================== */
function extractEmojis(str){
  if (!str) return [];
  let parts = [];
  if (typeof Intl !== "undefined" && Intl.Segmenter){
    const seg = new Intl.Segmenter("tr",{granularity:"grapheme"});
    parts = Array.from(seg.segment(str), s => s.segment);
  } else {
    parts = Array.from(str);
  }
  return parts.map(s => s.trim()).filter(Boolean);
}

// B MODU: gelen emojilerle stok birleştir + tekilleştir
function mergeWithImported(importedObjs){
  const oldEmojis = emojis.slice();
  const oldMap = new Map(oldEmojis.map(e => [e.emoji, e]));
  const oldSet = new Set(oldEmojis.map(e => e.emoji));

  const importedAll = [];
  const importedDistinctSet = new Set();

  importedObjs.forEach(o => {
    if (!o || !o.emoji) return;
    const ch = o.emoji;
    importedAll.push(ch);
    importedDistinctSet.add(ch);

    const prev = oldMap.get(ch);
    const merged = buildEmojiObj(
      ch,
      o.name || o.isim || (prev && prev.name),
      o.cat  || o.kategori || (prev && prev.cat)
    );
    oldMap.set(ch, merged);
  });

  const importedDistinct = importedDistinctSet.size;
  const duplicatesInFile = importedAll.length - importedDistinct;

  const finalEmojis = Array.from(oldMap.values());
  const finalTotal  = finalEmojis.length;

  const newFromFile = Array.from(importedDistinctSet)
    .filter(ch => !oldSet.has(ch)).length;

  const duplicatesVsStock = importedDistinct - newFromFile;
  const totalRemoved = (oldEmojis.length + importedAll.length) - finalTotal;

  emojis = finalEmojis;
  saveEmojis();
  updateCategories();
  applyFilters();

  statsEl.textContent = `📦 Stok: ${emojis.length} emoji`;
  reportEl.textContent =
    `✅ JSON yüklendi • +${newFromFile} yeni • 🔁 Dosya içi tekrar: ${duplicatesInFile}` +
    ` • 📦 Stokta zaten olan: ${duplicatesVsStock} • 🗑️ Silinen toplam tekrar: ${totalRemoved}`;
  showToast(reportEl.textContent);
}

// Manuel textarea’dan ekleme
function manualImport(){
  const chars = extractEmojis(pasteEl.value || "");
  if (!chars.length){
    alert("Emoji bulunamadı.");
    return;
  }
  const importedObjs = chars.map(ch => ({ emoji: ch }));
  mergeWithImported(importedObjs);
  closeImportModal();
}

/* ===============================
   YEDEKLEME (isim + kategori ile)
=============================== */
function backup(){
  const payload = emojis.map(e => ({
    emoji: e.emoji,
    isim:  e.name || "",
    kategori: e.cat || ""
  }));
  const blob = new Blob([JSON.stringify(payload, null, 2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "emoji-galaksi-stok.json";
  a.click();
  showToast(`💾 Yedek alındı • ${payload.length} emoji kaydedildi`);
}

/* ===============================
   JSON YÜKLEME 
=============================== */
function triggerRestore(){
  const f = document.getElementById("restoreFile");
  f.value = "";
  f.style.display = "block";
  f.click();
  setTimeout(() => f.style.display = "none", 50);
  showToast("📂 JSON dosyanı seç ve yükle");
}

function restoreFromFile(input){
  const file = input.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    try{
      let raw = reader.result.replace(/^\uFEFF/, "");
      let data = JSON.parse(raw);

      let importedObjs = [];

      if (Array.isArray(data) && data.length){
        // Format 1: ["😀","😁",...]
        if (typeof data[0] === "string"){
          importedObjs = data
            .filter(e => typeof e === "string" && e.trim())
            .map(e => ({ emoji: e.trim() }));
        }
        // Format 2: [{emoji:"😀", isim:"...", kategori:"Duygular"}, ...]
        else if (typeof data[0] === "object"){
          importedObjs = data
            .filter(e => e && e.emoji)
            .map(e => ({
              emoji: e.emoji,
              name: e.name || e.isim || "",
              cat:  e.cat  || e.kategori || ""
            }));
        } else {
          alert("❌ JSON formatı tanınmadı.");
          return;
        }
      } else {
        alert("❌ JSON boş veya geçersiz.");
        return;
      }

      mergeWithImported(importedObjs);

    }catch(err){
      console.error(err);
      alert("❌ Dosya bozuk veya uyumsuz.");
    }
  };
  reader.readAsText(file, "UTF-8");
}

/* ===============================
   EVENTLER & SCROLL
=============================== */
searchEl.oninput   = applyFilters;
filterEl.onchange  = applyFilters;

function scrollTopGrid(){
  document.querySelector(".grid-wrapper").scrollTo({top:0,behavior:"smooth"});
}

/* ===============================
   BAŞLAT
=============================== */
loadEmojis();
</script>
