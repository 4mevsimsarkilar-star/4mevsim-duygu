<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Excel'i JS'ye Çevirici</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 50px; background: #111; color: #fff; }
    .box { background: #222; padding: 40px; border-radius: 15px; border: 2px dashed #4ea9ff; max-width: 600px; margin: 0 auto; }
    input[type="file"] { font-size: 18px; margin-top: 20px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <h2>📂 Excel / CSV Dönüştürücü</h2>
    <p style="color: #aeb8c6;">Yüklediğin "NRA_His_Evreni" dosyasını seç, gerisini program halletsin.</p>
    
    <input type="file" id="file" accept=".xlsx, .csv">
    
    <h3 id="status" style="color: #22c55e; margin-top: 30px;"></h3>
  </div>

  <script>
    document.getElementById('file').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if(!file) return;
        
        document.getElementById('status').innerText = "⏳ İşleniyor, Lütfen Bekle...";
        const reader = new FileReader();
        
        reader.onload = function(evt) {
            const data = new Uint8Array(evt.target.result);
            const wb = XLSX.read(data, {type: 'array'});
            const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            
            let obj = { kalp:[], vatan:[], muzik:[], atmosfer:[], doku:[], mevsim:[], genel:[] };
            
            json.forEach(row => {
                let t = (row.His || row["His Adı"] || row["his ismi"] || row.title || "").toString().trim();
                let e = (row.Emoji || row.emoji || "✨").toString().trim();
                let c = (row.Kategori || row.category || "genel").toString().trim().toLowerCase().replace(/İ/g, "i").replace(/I/g, "ı");
                
                // Başlık satırlarını atla ve boş olmayanları ekle
                if(t && !["emoji", "his", "his adı", "kategori"].includes(t.toLowerCase())) {
                    if(!obj[c]) obj[c] = [];
                    obj[c].push([e, t]);
                }
            });

            // JS Dosyasını Otomatik Oluştur
            let jsContent = "const RAW_DATA = " + JSON.stringify(obj, null, 2) + ";";
            const blob = new Blob([jsContent], {type: "application/javascript"});
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "NRA-veriler.js";
            
            // Tıklamadan İndir
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            document.getElementById('status').innerText = "✅ 'NRA-veriler.js' başarıyla indirildi!\n\nArtık bu dosyayı ana programınla aynı klasöre koyabilirsin.";
        };
        reader.readAsArrayBuffer(file);
    });
  </script>
</body>
</html>
