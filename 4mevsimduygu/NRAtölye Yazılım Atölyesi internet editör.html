<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>NRA Yazılım Atölyesi</title>

<style>
:root { --bg:#1e1e1e; --panel:#2d2d2d; --accent:#ffca28; }
*{box-sizing:border-box}

body{
    margin:0;height:100vh;display:flex;flex-direction:column;
    background:var(--bg);color:white;
    font-family:'Segoe UI',sans-serif;overflow:hidden;
}

.top-bar{
    background:var(--panel);
    padding:10px 20px;
    display:flex;flex-wrap:wrap;gap:10px;
    justify-content:space-between;align-items:center;
    border-bottom:2px solid #111;
}

.btn-group{display:flex;gap:8px;align-items:center}

button{
    background:#444;color:white;
    border:1px solid #555;
    padding:6px 12px;border-radius:4px;
    cursor:pointer;
}
button:hover{border-color:var(--accent)}
.btn-danger{background:#721c24}
.btn-help{background:#b28900;font-weight:bold}

#search-box{
    display:none;align-items:center;gap:5px;
    background:#111;padding:6px;
    border-radius:4px;border:1px solid #555;
}
#search-input{background:none;border:none;color:white;outline:none;width:140px}
#search-info{font-size:11px;color:#aaa;min-width:60px}

.label-bar{
    display:flex;background:#111;font-size:11px;
    font-weight:bold;color:#777;
}
.label-bar div{width:50%;padding:4px 20px;border-right:1px solid #333}

.workspace{flex:1;display:flex}

textarea{
    width:50%;height:100%;
    background:#000;color:#9cdceb;
    padding:20px;font-family:Consolas,monospace;
    font-size:16px;line-height:1.6;
    border:none;outline:none;resize:none;
    border-right:2px solid #333;
}

iframe{width:50%;height:100%;border:none;background:white}

#help-panel{
    display:none;position:absolute;top:70px;right:20px;
    width:380px;max-height:80vh;
    background:#333;border:2px solid var(--accent);
    border-radius:8px;padding:15px;
    overflow:auto;z-index:1000;
}

input[type=file]{display:none}
</style>
</head>

<body>

<div class="top-bar">
    <div class="btn-group">
        <button id="openBtn">📂 Aç</button>
        <button id="downloadBtn">📥 İndir</button>
        <button id="undoBtn">↩️ Geri</button>
        <button id="redoBtn">↪️ İleri</button>
        <button id="searchBtn">🔍 Arama</button>

        <div id="search-box">
            <input id="search-input" placeholder="Ara...">
            <button id="nextBtn">⬇️</button>
            <button id="prevBtn">⬆️</button>            
            <span id="search-info"></span>
            <button id="closeSearchBtn">✖</button>
        </div>
    </div>

    <div class="btn-group">
        <button id="popupPreviewBtn">🖥️ Tam Önizleme</button>
        <button id="copyBtn">📋Kopyala</button>
        <button id="pasteBtn">📥Yapıştır</button>
        <button class="btn-danger" id="clearBtn">🗑️Temizle</button>
        <button class="btn-help" id="helpBtn">💡Bilgi</button>
        <input type="file" id="fileInput" accept=".html,.txt,.css,.js">
    </div>
</div>

<div class="label-bar">
    <div>EDİTÖR</div>
    <div>ÖNİZLEME</div>
</div>

<div class="workspace">
    <textarea id="editor" spellcheck="false"></textarea>
    <iframe id="preview"></iframe>
</div>

<div id="help-panel">
<h3>Bu Editör Nasıl Çalışır?</h3>
<p>Sol alan kod editörüdür.</p>
<p>Sağ alan iframe önizlemedir.</p>
<p><code>&lt;style&gt;</code> tasarımı belirler.</p>
<p><code>&lt;script&gt;</code> davranışı belirler.</p>
<p>iframe ana sayfadan izole çalışır.</p>
</div>

<script>
/* ---------- ELEMENTLER ---------- */
const editor=document.getElementById("editor");
const preview=document.getElementById("preview");
const fileInput=document.getElementById("fileInput");

const searchBox=document.getElementById("search-box");
const searchInput=document.getElementById("search-input");
const searchInfo=document.getElementById("search-info");

/* ---------- DEMO KOD (KORUNDU) ---------- */
const ilkKod = `<style>
body { 
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100vh;background:#f0f0f0;transition:0.5s;font-family:sans-serif;margin:0;
}
body.isik-acik { background:#00a2ff; }
.mesaj1 { font-size:32px;font-weight:800;margin-bottom:10px; }
.mesaj2 { font-size:20px;font-weight:600;margin-bottom:30px; }
.lamba {
  width:100px;height:100px;border-radius:50%;
  background:#333;cursor:pointer;
  border:5px solid #222;transition:0.4s;
}
.aktif-lamba { background:#ff0000; box-shadow:0 0 50px #ff0000; border-color:#ff0000; }
</style>

<div class="mesaj1">Projenizin Kodlarını Editöre Yazın</div>
<div class="mesaj2">Test Etmek İçin Aşağıdaki Düğmeye Basın</div>
<div id="ampul" class="lamba" onclick="isiklariYak()"></div>

<script>
function isiklariYak(){
  document.body.classList.toggle('isik-acik');
  document.getElementById('ampul').classList.toggle('aktif-lamba');
}
<\/script>`;

/* ---------- PREVIEW ---------- */
function updatePreview(){
    const d=preview.contentDocument;
    d.open(); d.write(editor.value); d.close();
}

/* ---------- UNDO / REDO ---------- */
let undoStack=[],redoStack=[];
function saveState(value){
    if (undoStack.length && undoStack[undoStack.length-1] === value) return;
    undoStack.push(value);
    if(undoStack.length > 100) undoStack.shift();
    redoStack.length = 0;
}



editor.addEventListener("input",()=>{
    saveState(lastValue);   // ← eski hali kaydet
    lastValue = editor.value;
    updatePreview();
});

document.getElementById("undoBtn").onclick = () => {
    if (!undoStack.length) return;

    redoStack.push(editor.value);   // şimdiki hali redo’ya at
    editor.value = undoStack.pop(); // eski hale dön
    lastValue = editor.value;       // 🔴 KRİTİK SATIR
    updatePreview();
};

document.getElementById("redoBtn").onclick = () => {
    if (!redoStack.length) return;

    undoStack.push(editor.value);   // şimdiki hali undo’ya at
    editor.value = redoStack.pop(); // redo state
    lastValue = editor.value;       // 🔴 KRİTİK SATIR
    updatePreview();
};

/* ---------- SEARCH ---------- */
let matches = [];
let index = 0;

document.getElementById("searchBtn").onclick = () => {
    searchBox.style.display = "flex";
    searchInput.focus();
};

document.getElementById("closeSearchBtn").onclick = () => {
    searchBox.style.display = "none";
    searchInput.value = "";
    matches = [];
    index = 0;
    searchInfo.textContent = "";
};

searchInput.addEventListener("input", () => {
    const q = searchInput.value;
    matches = [];
    index = 0;

    if (q.length < 2) {
        searchInfo.textContent = "";
        return;
    }

    const text = editor.value;
    const safe = q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const regex = new RegExp(safe, "gi");

    let match;
    while ((match = regex.exec(text)) !== null) {
        matches.push(match.index);
    }

    updateSearchInfo();
});


function updateSearchInfo() {
    if (!matches.length) {
        searchInfo.textContent = "0 sonuç";
        return;
    }
    searchInfo.textContent = `${index + 1} / ${matches.length}`;
}

function selectMatch() {
    if (!matches.length) return;

    const start = matches[index];
    const end = start + searchInput.value.length;

    editor.focus();
    editor.setSelectionRange(start, end);

    // --- SCROLL FIX ---
    const before = editor.value.slice(0, start);
    const line = before.split("\n").length - 1;
    const lineHeight = parseInt(getComputedStyle(editor).lineHeight);
    editor.scrollTop = line * lineHeight;
}


document.getElementById("nextBtn").onclick = () => {
    if (!matches.length) return;
    index = (index + 1) % matches.length;
    selectMatch();
    updateSearchInfo();
};

document.getElementById("prevBtn").onclick = () => {
    if (!matches.length) return;
    index = (index - 1 + matches.length) % matches.length;
    selectMatch();
    updateSearchInfo();
};

/* ---------- CLIPBOARD ---------- */
document.getElementById("copyBtn").onclick=()=>navigator.clipboard.writeText(editor.value);
document.getElementById("pasteBtn").onclick=async()=>{
    try{
        const t=await navigator.clipboard.readText();
        editor.setRangeText(t,editor.selectionStart,editor.selectionEnd,"end");
        updatePreview();
    }catch{
        alert("Tarayıcı izin vermedi. Ctrl+V kullanabilirsin.");
    }
};

/* ---------- FILE ---------- */
document.getElementById("openBtn").onclick=()=>fileInput.click();
fileInput.onchange=()=>{
    const r=new FileReader();
    r.onload=()=>{ editor.value=r.result; saveState(); updatePreview(); };
    r.readAsText(fileInput.files[0]);
};
document.getElementById("downloadBtn").onclick = () => {
    const content = editor.value;
    if (!content.trim()) {
        alert("İndirilecek içerik yok.");
        return;
    }

    const blob = new Blob([content], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "projem.html"; // varsayılan isim
    document.body.appendChild(a);
    a.click();

    document.body.removeChild(a);
    URL.revokeObjectURL(url);
};
document.getElementById("popupPreviewBtn").onclick = () => {
    const code = editor.value;
    if (!code.trim()) {
        alert("Önizlenecek kod yok.");
        return;
    }

    const w = window.open("", "_blank", "width=1200,height=800");
    if (!w) {
        alert("Popup engellendi. Tarayıcı izni ver.");
        return;
    }

    w.document.open();
    w.document.write(code);
    w.document.close();
};


/* ---------- MISC ---------- */
document.getElementById("clearBtn").onclick=()=>{
    if(confirm("Tüm kod silinsin mi?")){
        editor.value=""; saveState(); updatePreview();
    }
};
document.getElementById("helpBtn").onclick=()=>{
    const p=document.getElementById("help-panel");
    p.style.display=p.style.display==="block"?"none":"block";
};
/* ---------- INIT ---------- */
editor.value = ilkKod;
updatePreview();

let lastValue = editor.value;   // ✅ DOĞRU YER
saveState(lastValue);           // ✅ ilk state gerçek içerik

</script>
</body>
</html>
