name: Add 4mevsim Tek Proje tool card

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-tools-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add tool card if missing
        shell: python
        run: |
          from pathlib import Path

          p = Path('assets/index-BBC6-w5Q.js')
          s = p.read_text(encoding='utf-8')
          marker = 'id:"tek-proje",title:"✨ 4mevsimŞabloncu • Tek Proje"'
          if marker in s:
              print('Tool card already present; nothing to do.')
              raise SystemExit(0)

          needle = '{id:"converter",title:"Veri Dönüştürücü",description:"XLSX ve CSV dosyaları arasında hızlı dönüşüm. Veri analizi ve raporlama için ideal.",url:"/4mevsimduygu/Xlsx Csv veri Çevirici.html",icon:"📊",color:"from-blue-600 to-indigo-500"}'
          card = '{id:"tek-proje",title:"✨ 4mevsimŞabloncu • Tek Proje",description:"Ana Program merkezli birleşik üretim stüdyosu. NRA His Evreni, Video Kapak Prompt Aracı ve Dijital İçerik Asistanı tek proje içinde; ana veriler alt araçlara aktarılır.",url:"/4mevsimduygu/4mevsim-tek-proje/",icon:"✨",color:"from-teal-600 to-cyan-500"}'
          if needle not in s:
              raise SystemExit('Expected Araçlar list entry not found; aborting without changes.')
          p.write_text(s.replace(needle, card + ',' + needle, 1), encoding='utf-8')
          print('Tool card inserted.')

      - name: Commit patched bundle
        shell: bash
        run: |
          if git diff --quiet -- assets/index-BBC6-w5Q.js; then
            echo 'No bundle changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/index-BBC6-w5Q.js
          git commit -m 'Add 4mevsim Tek Proje to Tools page'
          git push
