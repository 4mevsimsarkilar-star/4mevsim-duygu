<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<title>NRAtölye PRO • NRA Prompt Aracı V5.0 (Ultimate)</title>

<style>
/* ========== v5.0 NRA HİS EVRENİ GÖRSEL TEMASI ========== */
:root {
    --bg: #0f1115;
    --card: #151922;
    --muted: #9aa3b2;
    --text: #e9ecf1;
    --accent: #14b8a6; 
    --line: #222838;
    --btn: #1f2633;
    --btnh: #273042;
    --amber: #f0c94b;
    --gold: #f5c26b;
    --danger: #ef4444;
    --btn-shadow: 0 18px 40px rgba(0,0,0,0.75);
}

* { box-sizing: border-box; transition: all 0.2s ease; }

body {
    margin: 0;
    background: radial-gradient(circle at top, #111827 0, #020308 52%, #000 100%);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, Arial, sans-serif;
    padding: 20px;
    display: flex;
    justify-content: center;
}

.container { max-width: 1000px; width: 100%; }

header {
    display: flex; align-items: center; justify-content: center; gap: 20px;
    margin-bottom: 25px; padding: 20px; border-radius: 24px;
    background: linear-gradient(135deg, rgba(15,23,42,0.88), rgba(15,23,42,0.65));
    border: 1px solid rgba(148,163,184,0.3); box-shadow: var(--btn-shadow); backdrop-filter: blur(18px);
}

.logo-real {
    width: 80px; height: 80px; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; overflow: hidden;
    background: radial-gradient(circle at 30% 30%, #a5f3fc 0, #22c55e 40%, #0f172a 100%);
    box-shadow: 0 0 0 1px rgba(15,23,42,.9), 0 0 18px rgba(45,212,191,.7), 0 0 40px rgba(56,189,248,.55);
    animation: nraGlow 4s ease-in-out infinite;
}

.logo-real img { width: 100%; height: 100%; object-fit: cover; }

@keyframes nraGlow {
  0%, 100% { box-shadow: 0 0 0 1px rgba(15,23,42,.9), 0 0 18px rgba(45,212,191,.7), 0 0 40px rgba(56,189,248,.55); }
  50% { box-shadow: 0 0 0 1px rgba(15,23,42,.9), 0 0 25px rgba(20, 184, 166, 0.9), 0 0 60px rgba(56,189,248,.8); transform: scale(1.02); }
}

header h2 {
    margin: 0; font-size: 26px;
    background: linear-gradient(to right, var(--accent), var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}

.main-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 25px; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

input, select, .auto-expand {
    width: 100%; background: #0f131a !important; border: 1px solid var(--line) !important;
    border-radius: 12px !important; color: var(--text) !important; padding: 14px !important;
    font-size: 15px; margin: 8px 0; outline: none;
}

/* Simge kutusu: Tek satır ve genişleyebilir */
.auto-expand {
    resize: none;
    overflow: hidden;
    min-height: 48px;
    height: 48px;
    display: block;
    font-family: inherit;
    line-height: 1.4;
}

.input-container { position: relative; }
.clear-input {
    position: absolute; right: 10px; top: 22px;
    background: var(--btn); border: 1px solid var(--line); color: var(--muted);
    border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 11px;
    z-index: 5;
}
.clear-input:hover { background: var(--danger); color: white; }

.icon-stock {
    background: rgba(255,255,255,0.02); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; margin: 5px 0 15px 0;
}
.icon-stock span { font-size: 13px; color: var(--muted); display: block; margin-bottom: 8px; }
.icon-stock small { font-size: 11px; color: var(--accent); display: block; margin-bottom: 10px; font-style: italic; }
.chips-container { display: flex; flex-wrap: wrap; gap: 6px; }

.chip {
    background: var(--btn); color: var(--text); border: 1px solid var(--line);
    padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer;
    font-weight: 500;
}
.chip:hover { background: var(--btnh); border-color: var(--accent); color: var(--accent); }

/* Seçilen simge stili */
.chip.selected {
    border-color: var(--accent) !important;
    background: rgba(20, 184, 166, 0.15);
    box-shadow: 0 0 10px rgba(20, 184, 166, 0.3);
    color: var(--accent);
}

.links {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 15px 0; padding: 12px;
    background: rgba(255,255,255,0.03); border-radius: 14px;
}

.links button {
    background: var(--btn); color: var(--muted); border: 1px solid var(--line);
    padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer;
}

.preview-area { text-align: center; border-top: 1px solid var(--line); padding-top: 20px; }
#previewImg {
    max-width: 100%; height: auto; max-height: 250px; border-radius: 15px;
    border: 2px dashed var(--line); margin: 15px 0; display: block; margin-left: auto; margin-right: auto;
}

.action-btns { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
.btn-main { background: var(--accent); color: #000; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
.btn-sub { background: var(--btn); color: var(--text); border: 1px solid var(--line); padding: 12px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
.btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); padding: 12px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }

.prompt-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px;
}

.prompt-box { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
.prompt-box h3 { margin: 0; font-size: 15px; color: var(--accent); }
.prompt-tr { font-size: 12px; color: var(--muted); display: block; margin-bottom: 10px; font-style: italic; }

textarea {
    width: 100%; height: 220px; background: #090c10; color: #cbd5e1; border: 1px solid #1e293b;
    border-radius: 10px; padding: 12px; font-family: monospace; font-size: 13px; resize: none;
}

.box-btns { display: flex; gap: 8px; margin-top: 10px; }
.copy-btn { flex: 2; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; padding: 10px; }
.edit-btn { flex: 1; background: var(--btn); color: var(--text); border: 1px solid var(--line); border-radius: 8px; font-weight: bold; cursor: pointer; }

.select-group { display: flex; gap: 10px; margin: 8px 0; }
.select-group select { margin: 0 !important; }

@media (max-width: 600px) {
    .select-group { flex-direction: column; }
}
</style>
</head>

<script>
const promptsData = Array.from({length: 33}, (_, i) => `p${i+1}`);

const titles = [

// Otomatik Genişleme Fonksiyonu
function autoGrow(element) {
    element.style.height = "48px";
    element.style.height = (element.scrollHeight) + "px";
}

function updatePrompts() {
    const channel = document.getElementById("channel").value.trim();
    const artist = document.getElementById("artist").value.trim();
    const song = document.getElementById("song").value.trim();
    const userIcon = document.getElementById("icon").value.trim();
    const format = document.getElementById("format").value;
    const watermarkStyle = document.getElementById("watermarkStyle").value;
    const focusStyle = document.getElementById("focusStyle").value;

    let sizeRule = format === "vertical" ? " --ar 9:16" : (format === "square" ? " --ar 1:1" : " --ar 16:9");
    
    let focusCommand = "";
    let iconModifier = "";
    let textPower = "";

    if (focusStyle === "subject_first") {
        focusCommand = "SUBJECT FOCUS: The person MUST be the absolute focal point with extreme high-definition clarity and sharp rim lighting. Subject must pop out aggressively from the background.";
        iconModifier = "BACKGROUND ELEMENTS: Place [ICON] ONLY in the far background with a soft bokeh blur. It must be subtle and MUST NOT overlap or distract from the subject.";
        textPower = "TYPOGRAPHY DOMINANCE: Use massive, bold, and extremely clear 3D typography. Text must be the most prominent and readable element, high-contrast, popping off the screen.";
    } else if (focusStyle === "artistic") {
        focusCommand = "ARTISTIC STYLE: Blend the person creatively with environmental effects and thematic textures. Subject and background should have a cohesive, painterly unity.";
        iconModifier = "SYMBOLS: Distribute [ICON] elements artistically and fluidly throughout the scene as part of the visual composition.";
        textPower = "ARTISTIC TYPOGRAPHY: Typography should be stylized and integrated into the overall art style, appearing as part of the aesthetic design.";
    } else { // standard
        focusCommand = "Keep the original person clearly visible. Subject MUST stand out strongly with sharp, glowing rim lighting, popping out perfectly from the background.";
        iconModifier = "Add symbolic [ICON] naturally. Symbols should integrate seamlessly without overshadowing the subject.";
        textPower = "Typography: Elegant 3D letters. Ensure clear hierarchy.";
    }
    
    let branding = "";
    if (channel) {
        if (watermarkStyle === "subtle") {
            branding = `\n\n[Watermark: Place the text "${channel}" in a tiny, elegant, semi-transparent modern font at the bottom corner.]`;
        } else if (watermarkStyle === "clear") {
            branding = `\n\n[Branding: Place the text "${channel}" in a solid, clearly readable, crisp professional font with high opacity at the bottom corner.]`;
        } else if (watermarkStyle === "neon") {
            branding = `\n\n[Branding: Place the text "${channel}" in a bright, glowing neon font at the bottom corner.]`;
        } else if (watermarkStyle === "gold") {
            branding = `\n\n[Signature: Place the text "${channel}" as a luxurious shiny golden signature at the bottom corner.]`;
        } else if (watermarkStyle === "musical_gold") {
            branding = `\n\n[Branding: Integrate the text "${channel}" with a 3D glossy golden musical staff and flowing musical notes. The text must be in a bold, premium 3D golden metallic font, starting with an elegant treble clef (sol anahtarı). Place the text prominently and logically; the musical symbols should complement but not overshadow the clearly readable text, forming a clean golden melody line at the bottom corner.]`;
        } else if (watermarkStyle === "flashy") {
            branding = `\n\n[Watermark: Place the text "${channel}" in a hyper-vibrant, 3D glitch effect font at the bottom corner.]`;
        }
    }

    let textSection = "";
    let textLines = [];
    if (artist) textLines.push(artist);
    if (song) textLines.push(song);
    
    if (textLines.length > 0) {

function selectIcon(iconName, btn) {
    const iconInput = document.getElementById("icon");
    let currentVal = iconInput.value.trim();
    
    // Butonun seçili halini toggle yap (seçiliyse kaldır, değilse ekle)
    if(btn.classList.contains('selected')) {
        btn.classList.remove('selected');
        // Yazıdan simgeyi kaldır
        let parts = currentVal.split(", ").filter(p => p !== iconName && p !== "");
        iconInput.value = parts.join(", ");
    } else {
        btn.classList.add('selected');
        // Yazıya simgeyi ekle
        if (currentVal === "") { iconInput.value = iconName; } 
        else { if (!currentVal.includes(iconName)) iconInput.value = currentVal + ", " + iconName; }
    }
    
    autoGrow(iconInput);
    updatePrompts();
}

function toggleEdit(id, btn) {
    const area = document.getElementById(id);
    if(area.hasAttribute("readonly")) {
        area.removeAttribute("readonly"); btn.innerText = "🔓 Düzenle"; btn.style.background = "var(--amber)";
    } else {
        area.setAttribute("readonly", "true"); btn.innerText = "🔒 Kilitli"; btn.style.background = "var(--btn)";
    }
}

function copyText(id, btn) {
    const area = document.getElementById(id); area.select(); document.execCommand("copy");
    btn.innerText = "✔ Kopyalandı"; setTimeout(() => { btn.innerText = "📋 Kopyala"; }, 1500);
}

function clearField(id) { 
    const el = document.getElementById(id);
    el.value = ""; 
    if(id === 'icon') {
        el.style.height = "48px";
        // Tüm butonlardaki 'selected' sınıfını temizle
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
    }
    updatePrompts(); 
}

function clearAllFields() { 
    ["channel", "artist", "song", "icon"].forEach(id => {
        const el = document.getElementById(id);
        el.value = "";
        if(id === 'icon') {
            el.style.height = "48px";
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
        }
    }); 
    updatePrompts(); 
}

let currentImg = "";
function previewImage(event) {
    const file = event.target.files[0];
    if(file) { currentImg = URL.createObjectURL(file); document.getElementById("previewImg").src = currentImg; }
}

function pasteImageButton() {
    navigator.clipboard.read().then(items => {
        for (const item of items) {
            for (const type of item.types) {
                if (type.startsWith("image/")) {
                    item.getType(type).then(blob => {
                        currentImg = URL.createObjectURL(blob);
                        document.getElementById("previewImg").src = currentImg;
                    });
                }
            }
        }
    }).catch(() => alert("Lütfen CTRL+V kullanın."));
}

document.addEventListener("paste", function(e) {
    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
    for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf("image") !== -1) {
            const blob = items[i].getAsFile();
            currentImg = URL.createObjectURL(blob);
            document.getElementById("previewImg").src = currentImg;
            break; 
        }
    }
});

function downloadImage() {
    if(!currentImg) return alert("Önce resim yükleyin veya yapıştırın!");
    const a = document.createElement("a"); a.href = currentImg; a.download = "nra-referans.png"; a.click();
}

function clearImage() { document.getElementById("previewImg").src = ""; currentImg = ""; document.getElementById("fileInput").value = ""; }

["channel", "artist", "song", "icon", "format", "watermarkStyle", "focusStyle"].forEach(id => {
    document.getElementById(id).addEventListener("input", updatePrompts);
    document.getElementById(id).addEventListener("change", updatePrompts);
});
